# 发布流水线（push 自动发版模式）：
# push 到 main / 手动触发都会跑 gate（ruff + ty + unittest，每次 push 都有 CI 反馈）；
# release job 只在 pyproject 版本号 **高于** GitHub 最新 release 时执行
# （相等或更低 = 没有发版意图，静默跳过，日志可见 bump=false）。
# 发布不需要打 tag：vpk upload github 用 pyproject 的版本创建 v{version} tag 与 release。
# 打包逻辑全在 scripts/package.py（Nuitka 编译 → vpk pack → vpk upload github）。
name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN 默认只读；vpk 建 release / 传资产需要写权限
permissions:
  contents: read

# 同一分支串行发布，上传期间不自动取消，避免发布半套资产。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 每次 push 的 CI 门禁（AGENTS.md §1），顺带产出「是否发版」判定
  gate:
    runs-on: windows-latest
    outputs:
      bump: ${{ steps.ver.outputs.bump }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        # 解释器由 .python-version / requires-python 决定，uv 自动下载对应版本
        with:
          enable-cache: true

      - run: uv sync --locked

      # 预发布也参与 SemVer 比较；只有成功读取到空列表才按首次发布处理。
      - name: compare version with published releases
        id: ver
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync python scripts/release_version.py

      - run: uvx ruff check .
      - run: uvx ty check
      - run: uv run --no-sync python -m unittest discover -s tests
      - run: uv run --no-sync python -m unittest discover -s packages/sysproxy/tests

  release:
    needs: gate
    # 手动触发可来自不同分支，所有发布仍写同一个仓库更新源。
    concurrency:
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    if: needs.gate.outputs.bump == 'true'
    runs-on: windows-latest
    timeout-minutes: 60 # Nuitka 全量编译（PySide6 + mitmproxy）约 15-30 分钟
    steps:
      # 全量历史 + tags：发布说明要从上一版 tag 起 git log
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      # 等待发布锁期间可能已有新版发布；锁内复查，旧 gate 结果不授权覆盖。
      - name: recheck version after acquiring the publish lock
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync python scripts/release_version.py

      # 本地 vpk 是全局 dotnet tool，不随仓库走；runner 上现装，.NET SDK 镜像自带
      - if: steps.ver.outputs.bump == 'true'
        run: dotnet tool install -g vpk

      # build/ 不进 git，CI 上是空目录 → 只出 full 包；先拉上一版 release 资产，
      # vpk pack 才能生成 delta 增量包；有正式版时下载失败必须可见。
      - name: fetch previous release for delta
        if: steps.ver.outputs.bump == 'true' && steps.ver.outputs.previous_stable != ''
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path build/releases
          vpk download github --outputDir build/releases --repoUrl "${{ github.server_url }}/${{ github.repository }}"

      # 脚本内部把 GITHUB_TOKEN 转成 VPK_TOKEN 传给 vpk，不落命令行；
      # repoUrl 默认使用 core.meta.REPO_URL；--repo-url 可覆盖。
      # 默认直接 publish（draft 不进更新源）；tag v{version} 由 vpk 创建。
      - name: build & publish
        if: steps.ver.outputs.bump == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync python scripts/package.py --upload --repo-url "${{ github.server_url }}/${{ github.repository }}"

      # vpk 不支持写 release body；发布完成后用 gh 把自上一版以来的提交清单
      # 补进去。vpk 的 tag 是发布时才在远端创建的、checkout 拿不到，所以本地
      # 上一版取自锁内复查结果，避免本地未发布 tag 混入。
      - name: attach changelog to release
        if: steps.ver.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RELEASE: ${{ steps.ver.outputs.previous }}
        shell: bash
        run: |
          VERSION="$(uv run --no-sync python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          PREV="$PREVIOUS_RELEASE"
          if [ -z "$PREV" ]; then
            echo "没有上一版 tag，跳过变更说明"
            exit 0
          fi
          {
            echo "## 更新内容"
            echo
            git log "${PREV}..HEAD" --pretty=format:"- %h %s"
            echo
            echo
            echo "**完整变更**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...v${VERSION}"
          } > release_notes.md
          gh release edit "v${VERSION}" --notes-file release_notes.md --repo "${GITHUB_REPOSITORY}"

      # Release 之外再存一份产物，方便不入库查看 / 失败排查
      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.bump == 'true'
        with:
          name: releases
          path: build/releases/
