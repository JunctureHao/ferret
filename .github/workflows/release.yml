# 发布流水线（push 自动发版模式）：
# push 到 main / 手动触发都会跑 gate（ruff + ty + unittest，每次 push 都有 CI 反馈）；
# release job 只在 pyproject 版本号 **高于** GitHub 最新 release 时执行
# （相等或更低 = 没有发版意图，静默跳过，日志可见 bump=false）。
# 发布不需要打 tag：vpk upload github 用 pyproject 的版本创建 v{version} tag 与 release。
# 打包逻辑全在 scripts/package.py（Nuitka 编译 → vpk pack → vpk upload github）。
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN 默认只读；vpk 建 release / 传资产需要写权限
permissions:
  contents: write

# 快速连续 push 时只保留最新一次：旧构建即使发布成功也会被更高版本立刻覆盖
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 每次 push 的 CI 门禁（AGENTS.md §1），顺带产出「是否发版」判定
  gate:
    runs-on: windows-latest
    outputs:
      bump: ${{ steps.ver.outputs.bump }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        # 解释器由 .python-version / requires-python 决定，uv 自动下载对应版本
        with:
          enable-cache: true

      - run: uv sync

      # 对比 pyproject 版本与 GitHub 最新 release：更高才发版。
      # 首次发布（线上还没有 release）按 0 处理，必然触发；
      # 用 venv 的 python（3.12.13 有 tomllib），runner 系统 python 不保证。
      - name: compare version with latest release
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BUMP="$(uv run --no-sync python - <<'PY'
          import os, subprocess, sys, tomllib

          repo = os.environ["GITHUB_REPOSITORY"]
          new = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]

          def key(v):
              base, _, pre = v.strip().lstrip("v").partition("-")
              nums = tuple(int(x) for x in base.split("."))
              # 预发版（如 -rc.1）排在同号正式版之前
              return (nums, (0, pre) if pre else (1,))

          try:
              old = subprocess.run(
                  ["gh", "api", f"repos/{repo}/releases/latest", "--jq", ".tag_name"],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()
          except (subprocess.CalledProcessError, FileNotFoundError):
              old = "0"

          bump = key(new) > key(old)
          print(f"pyproject={new}  latest_release={old}  bump={bump}", file=sys.stderr)
          print("true" if bump else "false")
          PY
          )"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - run: uvx ruff check .
      - run: uvx ty check
      - run: uv run python -m unittest discover -s tests

  release:
    needs: gate
    if: needs.gate.outputs.bump == 'true'
    runs-on: windows-latest
    timeout-minutes: 60 # Nuitka 全量编译（PySide6 + mitmproxy）约 15-30 分钟
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync
      # 本地 vpk 是全局 dotnet tool，不随仓库走；runner 上现装，.NET SDK 镜像自带
      - run: dotnet tool install -g vpk

      # build/ 不进 git，CI 上是空目录 → 只出 full 包；先拉上一版 release 资产，
      # vpk pack 才能生成 delta 增量包。首个版本没有上一版，允许失败继续。
      - name: fetch previous release for delta
        continue-on-error: true
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/releases
          vpk download github --outputDir build/releases --repoUrl "${{ github.server_url }}/${{ github.repository }}"

      # 脚本内部把 GITHUB_TOKEN 转成 VPK_TOKEN 传给 vpk，不落命令行；
      # repoUrl 从 pyproject [project.urls] 读取（git origin 兜底）。
      # 默认直接 publish（draft 不进更新源）；tag v{version} 由 vpk 创建。
      - name: build & publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/package.py --upload

      # Release 之外再存一份产物，方便不入库查看 / 失败排查
      - uses: actions/upload-artifact@v4
        with:
          name: releases
          path: build/releases/
