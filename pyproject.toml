[project]
name = "ferret"
version = "0.1.2"
description = "Windows Desktop Packet Capture Tool: mitmproxy Core + PySide6 / QFluentWidgets GUI"
license = "GPL-3.0-only"
readme = "README.md"
requires-python = "==3.12.13"
dependencies = [
  "mitmproxy>=12.2.3",
  "nuitka>=4.1.3",
  "pyside6==6.10.3",
  "pyside6-fluent-widgets==1.11.3",
  "segno>=1.6.6",
  "sysproxy",
  "velopack>=1.2.0",
]

[project.scripts]
ferret = "ferret.__main__:main"
ferret-resources = "ferret.utils.scripts:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sysproxy = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"
